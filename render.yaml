services:
  - type: web
    name: ai-receptionist
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false          # STT (Whisper) — set manually in Render dashboard
      - key: DEEPGRAM_API_KEY
        sync: false          # TTS (Aura) — sign up free at console.deepgram.com
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: DATABASE_URL
        value: sqlite:///./receptionist.db
    disk:
      name: receptionist-data
      mountPath: /app
      sizeGB: 1
