services:
  - type: web
    name: ai-receptionist
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false          # You set this manually in Render dashboard — never commit API keys
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: DATABASE_URL
        value: sqlite:///./receptionist.db
    disk:
      name: receptionist-data
      mountPath: /app
      sizeGB: 1
