plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aireceptionist.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.aireceptionist.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // Default server address — change this to your PC's local IP when testing
        // e.g. "ws://10.215.176.170:8000/ws/audio"
        buildConfigField "String", "DEFAULT_SERVER_WS_URL", "\"ws://10.215.176.170:8000/ws/audio\""
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'

    // OkHttp WebSocket
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
